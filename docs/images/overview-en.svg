<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Tracery three-pane interface</title>
  <desc id="d">Schematic of the three-pane reading interface: a session list on the left, a per-step trace in the middle, and readings on the right, with synthetic session names and agent labels.</desc>
  <style>
    .bg{fill:#FAFAFA}.card{fill:#FFFFFF;stroke:#ECECEA;stroke-width:1}
    .line{stroke:#ECECEA;stroke-width:1}.divide{stroke:#DEDEDB;stroke-width:1}
    .txt{fill:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#A1A1AA}.sub{fill:#52525B}.user{fill:#0066CC}.assistant{fill:#8E44AD}
    .tool{fill:#B45309}.accent{fill:#007AFF}.good{fill:#167a4f}
    .soft{fill:#007AFF;fill-opacity:.07}.inset{fill:#F5F5F4}
    .t1{fill:#007AFF;fill-opacity:.16}.t2{fill:#007AFF;fill-opacity:.12}
    .t3{fill:#007AFF;fill-opacity:.08}.t4{fill:#007AFF;fill-opacity:.05}
    .lbl{font-size:10px;letter-spacing:.09em}.h{font-size:14px;font-weight:600}
    .s{font-size:12px}.sm{font-size:11px}.xs{font-size:10px}
  </style>
  <rect class="bg" x="0" y="0" width="960" height="470" rx="10"/>

  <!-- brand bar -->
  <rect x="0" y="0" width="960" height="38" fill="#FFFFFF"/>
  <text class="txt h" x="20" y="25">Tracery</text>
  <text class="txt xs muted" x="104" y="25">session reading</text>
  <text class="txt xs mono muted" x="940" y="25" text-anchor="end">127.0.0.1:8320</text>
  <line class="line" x1="0" y1="38" x2="960" y2="38"/>

  <!-- left: session list -->
  <rect class="card" x="20" y="50" width="228" height="370" rx="4"/>
  <text class="txt lbl muted" x="32" y="70">SESSIONS · 20</text>
  <rect class="inset" x="32" y="80" width="204" height="22" rx="3"/>
  <text class="txt xs muted" x="40" y="95">Search sessions</text>
  <rect x="32" y="110" width="46" height="18" rx="9" class="soft"/>
  <text class="txt xs accent" x="40" y="123">All</text>
  <text class="txt xs muted" x="86" y="123">claude-code · +3</text>

  <rect class="soft" x="32" y="138" width="204" height="46" rx="3"/>
  <rect x="32" y="138" width="3" height="46" rx="1.5" class="accent"/>
  <text class="txt s" x="42" y="156">Fix the failing diff check</text>
  <text class="txt xs mono sub" x="42" y="174">claude-code · 44 req</text>
  <text class="txt xs mono muted" x="228" y="156" text-anchor="end">00:25</text>

  <text class="txt s" x="42" y="202">Refactor ingest core</text>
  <text class="txt xs mono sub" x="42" y="220">codex · 31 req</text>
  <text class="txt xs mono muted" x="228" y="202" text-anchor="end">00:18</text>
  <line class="line" x1="32" y1="230" x2="236" y2="230"/>

  <text class="txt s" x="42" y="250">Add OTLP full profile</text>
  <text class="txt xs mono sub" x="42" y="268">droid · 26 req</text>
  <text class="txt xs mono muted" x="228" y="250" text-anchor="end">00:12</text>
  <line class="line" x1="32" y1="278" x2="236" y2="278"/>

  <text class="txt s" x="42" y="298">Trace CSV parser bug</text>
  <text class="txt xs mono sub" x="42" y="316">OMP · 19 req</text>
  <text class="txt xs mono muted" x="228" y="298" text-anchor="end">00:09</text>
  <line class="line" x1="32" y1="326" x2="236" y2="326"/>

  <text class="txt s" x="42" y="346">Review retention budget</text>
  <text class="txt xs mono sub" x="42" y="364">claude-code · 12 req · +1</text>
  <text class="txt xs mono muted" x="228" y="346" text-anchor="end">00:04</text>
  <text class="txt xs muted" x="32" y="402">Sessions from every agent in one list.</text>

  <!-- middle: trace -->
  <text class="txt h" x="268" y="68">Fix the failing diff check</text>
  <text class="txt xs mono sub" x="268" y="88">claude-code · session a3f1 · 44 requests</text>
  <text class="txt xs mono muted" x="268" y="106">208k tokens · $0.42 · cache 81% · 1 subagent</text>
  <line class="line" x1="260" y1="118" x2="656" y2="118"/>

  <text class="txt xs mono muted" x="268" y="140">6</text>
  <rect x="286" y="130" width="3" height="18" rx="1.5" class="user"/>
  <text class="txt s mono" x="298" y="144">system 12,804 tok · project instructions</text>

  <text class="txt xs mono muted" x="268" y="174">6</text>
  <rect x="286" y="164" width="3" height="18" rx="1.5" class="assistant"/>
  <text class="txt s mono" x="298" y="178">assistant → Bash("git diff")</text>
  <text class="txt xs mono muted" x="656" y="178" text-anchor="end">1.8s</text>

  <text class="txt xs mono muted" x="268" y="208">6</text>
  <rect x="286" y="198" width="3" height="18" rx="1.5" class="tool"/>
  <text class="txt s mono" x="298" y="212">tool_result  exit 1: no diff in index</text>
  <text class="txt xs mono muted" x="656" y="212" text-anchor="end">3.2s</text>

  <text class="txt xs mono muted" x="268" y="242">7</text>
  <rect x="286" y="232" width="3" height="18" rx="1.5" class="assistant"/>
  <text class="txt s mono" x="298" y="246">assistant  The index is clean</text>

  <rect x="260" y="260" width="396" height="30" rx="4" class="inset"/>
  <text class="txt lbl muted" x="272" y="279">REQ 7</text>
  <text class="txt s mono accent" x="322" y="279">+2 messages vs req 6</text>
  <text class="txt xs mono sub" x="486" y="279">prefix matched</text>

  <text class="txt xs mono muted" x="268" y="316">8</text>
  <rect x="286" y="306" width="3" height="18" rx="1.5" class="accent"/>
  <text class="txt s mono" x="298" y="320">Agent tool → S1</text>
  <text class="txt xs mono accent" x="656" y="320" text-anchor="end">jump</text>

  <text class="txt xs muted" x="268" y="356">Main chain · auxiliary requests stay off it</text>
  <text class="txt xs muted" x="268" y="374">One row per step. Click any row to point the right pane at it.</text>

  <!-- right: readings -->
  <rect class="card" x="676" y="50" width="264" height="370" rx="4"/>
  <text class="txt sm accent" x="690" y="72">Readings</text>
  <text class="txt sm muted" x="762" y="72">Body</text>
  <text class="txt sm muted" x="808" y="72">Tools</text>
  <text class="txt sm muted" x="858" y="72">Routing</text>
  <line x1="690" y1="80" x2="738" y2="80" stroke="#007AFF" stroke-width="2"/>
  <line class="line" x1="676" y1="82" x2="940" y2="82"/>

  <rect class="inset" x="690" y="94" width="236" height="30" rx="3"/>
  <text class="txt sm sub" x="700" y="113">This reply</text>
  <text class="txt xs mono muted" x="916" y="113" text-anchor="end">tool_use</text>
  <rect class="inset" x="690" y="130" width="236" height="30" rx="3"/>
  <text class="txt sm sub" x="700" y="149">Request structure</text>
  <text class="txt xs mono accent" x="916" y="149" text-anchor="end">+2</text>
  <rect class="inset" x="690" y="166" width="236" height="30" rx="3"/>
  <text class="txt sm sub" x="700" y="185">Tool list</text>
  <text class="txt xs mono muted" x="916" y="185" text-anchor="end">15</text>
  <rect class="inset" x="690" y="202" width="236" height="30" rx="3"/>
  <text class="txt sm sub" x="700" y="221">Skills</text>
  <text class="txt xs mono muted" x="916" y="221" text-anchor="end">36</text>

  <text class="txt lbl muted" x="690" y="252">CONTEXT · TOKEN SHARE</text>
  <rect class="t1" x="690" y="260" width="100" height="86"/>
  <rect class="t2" x="794" y="260" width="132" height="52"/>
  <rect class="t3" x="794" y="316" width="132" height="30"/>
  <rect class="t4" x="690" y="350" width="236" height="26"/>
  <text class="txt xs mono sub" x="698" y="278">tool results</text>
  <text class="txt sm mono" x="698" y="294">41%</text>
  <text class="txt xs mono sub" x="802" y="278">tool defs</text>
  <text class="txt sm mono" x="802" y="294">24%</text>
  <text class="txt xs mono sub" x="802" y="334">skills / system / memory</text>

  <line class="line" x1="690" y1="386" x2="926" y2="386"/>
  <text class="txt xs mono sub" x="690" y="404">used 25.9k · overhead 24.1k · cache 97%</text>

  <text class="txt xs mono muted" x="20" y="440">Schematic — synthetic session names and numbers illustrate the layout, not a captured session.</text>
  <text class="txt xs mono muted" x="20" y="458">Tracery · local session reading</text>
</svg>
