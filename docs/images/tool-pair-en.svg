<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">Tool call and result pairing</title>
  <desc id="d">Schematic of the Tools tab: one call's JSON and its result body sit side by side under the same call_id, with an arrow showing which later request carried the result back.</desc>
  <style>
    .bg{fill:#FAFAFA}.card{fill:#FFFFFF;stroke:#ECECEA;stroke-width:1}
    .line{stroke:#ECECEA;stroke-width:1}
    .txt{fill:#171717;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#A1A1AA}.sub{fill:#52525B}.accent{fill:#007AFF}.bad{fill:#b32e37}
    .soft{fill:#007AFF;fill-opacity:.07}.inset{fill:#F5F5F4}
    .flow{stroke:#007AFF;stroke-width:1.6;fill:none}
    .lbl{font-size:10px;letter-spacing:.09em}.h{font-size:14px;font-weight:600}
    .s{font-size:12px}.sm{font-size:11px}.xs{font-size:10px}
  </style>
  <rect class="bg" x="0" y="0" width="960" height="360" rx="10"/>
  <text class="txt h" x="24" y="30">One call, one result, paired by call_id</text>
  <text class="txt xs mono muted" x="24" y="48">Synthetic example — no real request bodies.</text>

  <!-- tabs -->
  <rect class="card" x="24" y="66" width="912" height="34" rx="4"/>
  <text class="txt sm accent" x="38" y="87">Tools</text>
  <text class="txt sm muted" x="98" y="87">Overview</text>
  <text class="txt sm muted" x="182" y="87">Arguments</text>
  <rect x="266" y="72" width="58" height="22" rx="3" class="soft"/>
  <text class="txt sm accent" x="278" y="87">Pairing</text>
  <text class="txt sm muted" x="344" y="87">Schema</text>
  <text class="txt xs mono muted" x="922" y="87" text-anchor="end">Bash · call #1 · 307ms</text>

  <!-- call side -->
  <text class="txt lbl muted" x="24" y="124">CALL · request 6 · reply.content[1]</text>
  <rect class="card" x="24" y="134" width="420" height="112" rx="4"/>
  <rect class="inset" x="36" y="146" width="396" height="88" rx="3"/>
  <text class="txt s mono sub" x="48" y="166">{</text>
  <text class="txt s mono sub" x="48" y="186">  "name": "Bash",</text>
  <text class="txt s mono sub" x="48" y="206">  "input": { "command": "git diff" }</text>
  <text class="txt s mono sub" x="48" y="226">}</text>
  <rect x="36" y="252" width="396" height="24" rx="3" class="soft"/>
  <text class="txt xs mono accent" x="46" y="268">call_id = toolu_01A7…  ·  same id on both sides</text>

  <!-- result side -->
  <text class="txt lbl muted" x="516" y="124">RESULT · request 7 · messages[3]</text>
  <rect class="card" x="516" y="134" width="420" height="112" rx="4"/>
  <rect class="inset" x="528" y="146" width="396" height="88" rx="3"/>
  <text class="txt s mono sub" x="540" y="166">exit 1: no diff in index</text>
  <text class="txt s mono sub" x="540" y="190">The next assistant line gives the fix.</text>
  <rect x="528" y="252" width="396" height="24" rx="3" class="soft"/>
  <text class="txt xs mono accent" x="538" y="268">Carried back by request 7, at message position 3</text>

  <!-- flow -->
  <path class="flow" d="M444 240 H472 V276 H516"/>
  <path d="M516 276 l-7 -4 v8 z" fill="#007AFF"/>
  <text class="txt xs mono sub" x="450" y="230">next request</text>

  <!-- annotation -->
  <rect x="24" y="288" width="912" height="52" rx="4" class="inset"/>
  <text class="txt lbl muted" x="38" y="308">WHY THIS MATTERS</text>
  <text class="txt sm sub" x="38" y="328">Execution time is measured per call: result request start minus call request end. It includes client-side work and human confirmation, so it is an upper bound.</text>

  <text class="txt xs mono muted" x="24" y="352">Schematic — the call, result and positions illustrate the pairing view.</text>
</svg>
