<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">Tracery 会话阅读示意</title>
  <desc id="d">一次 Agent 会话的读回示意：会话头给出调用笔数与 token 总量，轨迹显示逐笔新增消息、推理段与执行段、子代理跳转，右侧是按 token 面积铺开的上下文构成。</desc>
  <style>
    .bg{fill:#FAFAFA}.card{fill:#FFFFFF;stroke:#ECECEA;stroke-width:1}
    .line{stroke:#ECECEA;stroke-width:1}.divide{stroke:#DEDEDB;stroke-width:1}
    .txt{fill:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#A1A1AA}.sub{fill:#52525B}.user{fill:#0066CC}.assistant{fill:#8E44AD}
    .tool{fill:#B45309}.accent{fill:#007AFF}.good{fill:#167a4f}
    .t1{fill:#007AFF;fill-opacity:.16}.t2{fill:#007AFF;fill-opacity:.12}
    .t3{fill:#007AFF;fill-opacity:.08}.t4{fill:#007AFF;fill-opacity:.05}
    .lbl{font-size:10px;letter-spacing:.09em}.h{font-size:13px;font-weight:600}
    .s{font-size:12px}.sm{font-size:11px}.xs{font-size:10px}
  </style>

  <rect class="bg" x="0" y="0" width="960" height="480" rx="10"/>
  <text class="txt h" x="24" y="30">会话 a3f1 · claude-code</text>
  <text class="txt s mono" x="24" y="50">44 笔请求   ·   208k tokens   ·   $0.42</text>
  <text class="txt lbl muted" x="730" y="30">上下文 · TOKEN 占比</text>
  <line class="line" x1="24" y1="62" x2="936" y2="62"/>

  <!-- 会话摘要条 -->
  <text class="txt lbl muted" x="24" y="82">第 6 笔</text>
  <rect class="card" x="24" y="92" width="672" height="28" rx="4"/>
  <rect x="24" y="92" width="3" height="28" rx="1.5" class="user"/>
  <text class="txt s mono" x="38" y="110">system 12,804 tok  ·  user "修好失败的 diff 检查"</text>
  <text class="txt xs mono muted" x="560" y="110">上下文 61%</text>

  <rect class="card" x="24" y="126" width="672" height="28" rx="4"/>
  <rect x="24" y="126" width="3" height="28" rx="1.5" class="assistant"/>
  <text class="txt s mono" x="38" y="144">assistant → Bash("git diff")</text>
  <text class="txt xs mono muted" x="560" y="144">推理段 1.8s</text>

  <rect class="card" x="24" y="160" width="672" height="28" rx="4"/>
  <rect x="24" y="160" width="3" height="28" rx="1.5" class="tool"/>
  <text class="txt s mono" x="38" y="178">tool_result  exit 1: 索引里没有 diff</text>
  <text class="txt xs mono muted" x="560" y="178">执行段 3.2s</text>

  <rect class="card" x="24" y="196" width="672" height="28" rx="4"/>
  <rect x="24" y="196" width="3" height="28" rx="1.5" class="assistant"/>
  <text class="txt s mono" x="38" y="214">assistant "索引是干净的，改读工作区"</text>

  <!-- 逐笔差异 -->
  <rect x="24" y="234" width="672" height="30" rx="4" fill="#F7F7F6" stroke="#DEDEDB" stroke-width="1"/>
  <text class="txt lbl muted" x="36" y="253">第 7 笔</text>
  <text class="txt s mono accent" x="106" y="253">比第 6 笔多 2 条消息</text>
  <rect x="268" y="242" width="62" height="16" rx="8" fill="#007AFF" fill-opacity=".07"/>
  <text class="txt xs mono accent" x="277" y="254">前缀 ✓</text>
  <text class="txt xs mono sub" x="342" y="254">同一支 · 链未断</text>
  <text class="txt xs mono muted" x="560" y="254">上下文 78%</text>

  <!-- 两种耗时 -->
  <rect class="card" x="24" y="276" width="672" height="60" rx="4"/>
  <text class="txt lbl muted" x="38" y="296">两种耗时，归属不同</text>
  <rect x="38" y="306" width="9" height="9" rx="2" class="assistant"/>
  <text class="txt sm mono sub" x="54" y="315">推理段 1.8s</text>
  <text class="txt xs muted" x="166" y="315">按整笔请求，挂在 assistant 行</text>
  <rect x="360" y="306" width="9" height="9" rx="2" class="tool"/>
  <text class="txt sm mono sub" x="376" y="315">执行段 3.2s</text>
  <text class="txt xs muted" x="488" y="315">按每次调用，含人工确认</text>
  <text class="txt xs muted" x="38" y="328">执行段是上界：包含客户端处理与人工确认时间。</text>

  <!-- 子代理跳转 -->
  <rect x="24" y="348" width="672" height="52" rx="4" fill="#F7F7F6" stroke="#DEDEDB" stroke-width="1"/>
  <rect x="24" y="348" width="3" height="52" rx="1.5" class="accent"/>
  <text class="txt lbl muted" x="38" y="367">子代理</text>
  <text class="txt s mono" x="38" y="388">第 6 笔 · Agent 工具</text>
  <path d="M170 383 H240" fill="none" stroke="#007AFF" stroke-width="1.5"/>
  <path d="M240 383 l-7 -4 v8 z" fill="#007AFF"/>
  <rect x="250" y="369" width="46" height="24" rx="4" fill="#007AFF" fill-opacity=".07" stroke="#007AFF" stroke-opacity=".35"/>
  <text class="txt s mono accent" x="263" y="386">S1</text>
  <text class="txt xs mono sub" x="308" y="386">跳到这次调用启动的子代理轨迹</text>

  <!-- 上下文矩阵 -->
  <rect class="card" x="712" y="44" width="224" height="356" rx="4"/>
  <rect class="t1" x="724" y="68" width="92" height="146"/>
  <rect class="t2" x="820" y="68" width="104" height="88"/>
  <rect class="t3" x="820" y="160" width="104" height="54"/>
  <rect class="t2" x="724" y="218" width="56" height="68"/>
  <rect class="t3" x="784" y="218" width="56" height="68"/>
  <rect class="t4" x="844" y="218" width="80" height="68"/>
  <rect class="t4" x="724" y="290" width="200" height="36"/>
  <text class="txt xs mono sub" x="732" y="86">工具结果</text>
  <text class="txt sm mono" x="732" y="104">41%</text>
  <text class="txt xs mono sub" x="828" y="86">工具定义</text>
  <text class="txt sm mono" x="828" y="104">24%</text>
  <text class="txt xs mono sub" x="828" y="178">技能</text>
  <text class="txt xs mono sub" x="730" y="236">系统提示</text>
  <text class="txt xs mono sub" x="790" y="236">记忆</text>
  <text class="txt xs mono sub" x="852" y="236">对话</text>
  <text class="txt xs mono sub" x="732" y="312">缓存命中 68%  ·  固定开销 9,240 tok</text>
  <text class="txt xs mono muted" x="724" y="344">项目指令、技能、记忆、工具结果</text>
  <text class="txt xs mono muted" x="724" y="360">只在组装后的请求体里看得见。</text>
  <text class="txt xs mono accent" x="724" y="384">这一笔的上下文塞多了。</text>

  <text class="txt xs mono muted" x="24" y="430">示意图 — 标签与数字用于说明阅读视图能看到什么，并非抓取的会话。</text>
  <text class="txt xs mono muted" x="24" y="450">第 6 → 7 笔：逐条消息比对  ·  右栏：读数 / 正文 / 工具 / 路由</text>
  <line class="line" x1="24" y1="462" x2="936" y2="462"/>
  <text class="txt xs mono muted" x="24" y="475">Tracery · 本机会话阅读</text>
</svg>
