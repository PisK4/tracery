<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tracery</title>
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="icon" href="/tracery-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/tracery-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar" data-tauri-drag-region="deep">
  <button class="brand" id="brand-home" title="回到主页并刷新">
    <img class="brand-mark brand-mark--light" src="/tracery-light.svg" width="20" height="20" alt="" aria-hidden="true">
    <img class="brand-mark brand-mark--dark" src="/tracery-dark.svg" width="20" height="20" alt="" aria-hidden="true">
    <span>Tracery</span>
  </button>
  <div class="crumb" id="crumb"></div>
  <div class="grow"></div>
  <div class="toolbar-right">
    <span id="backend-slot"></span>
    <button class="icon-btn" id="sidebar-toggle" aria-controls="sessions-col" aria-expanded="true" aria-label="收起会话栏" title="收起会话栏"><svg class="ico" width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="8" width="36" height="32" rx="4" fill="none"/><path d="M19 8V40"/></svg></button>
    <button class="icon-btn" id="rail-toggle" aria-controls="rail-col" aria-expanded="true" aria-label="收起详情栏" title="收起详情栏"><svg class="ico" width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="8" width="36" height="32" rx="4" fill="none"/><path d="M29 8V40"/></svg></button>
    <button class="icon-btn" id="lang-toggle" aria-label="切换界面语言" title="切换界面语言">EN</button>
    <button class="icon-btn" id="theme-toggle" aria-label="切换主题" title="切换主题"><svg class="ico" width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.15039 9.15088L11.3778 11.3783"/><path d="M3 24H6.15"/><path d="M9.15039 38.8495L11.3778 36.6221"/><path d="M38.8495 38.8495L36.6221 36.6221"/><path d="M44.9996 24H41.8496"/><path d="M38.8495 9.15088L36.6221 11.3783"/><path d="M24 3V6.15"/><path d="M24 36C30.6274 36 36 30.6274 36 24C36 17.3726 30.6274 12 24 12C17.3726 12 12 17.3726 12 24C12 30.6274 17.3726 36 24 36Z" fill="none"/><path d="M24 45.0001V41.8501"/></svg></button>
    <button class="icon-btn" id="set-settings-toggle" aria-label="设置" title="设置" aria-pressed="false"><svg class="ico" width="18" height="18" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M11 16V42"/><path d="M24 29V42"/><path d="M24 19V6"/><path d="M37 6V32"/><path d="M11 16C13.7614 16 16 13.7614 16 11C16 8.23858 13.7614 6 11 6C8.23858 6 6 8.23858 6 11C6 13.7614 8.23858 16 11 16Z" fill="none"/><path d="M24 29C26.7614 29 29 26.7614 29 24C29 21.2386 26.7614 19 24 19C21.2386 19 19 21.2386 19 24C19 26.7614 21.2386 29 24 29Z" fill="none"/><path d="M37 42C39.7614 42 42 39.7614 42 37C42 34.2386 39.7614 32 37 32C34.2386 32 32 34.2386 32 37C32 39.7614 34.2386 42 37 42Z" fill="none"/></svg></button>
  </div>
</header>

<div class="app">
  <aside class="col col-sessions" id="sessions-col" aria-label="会话列表">
    <div class="sessions-head">
      <div class="sessions-title"><h2>会话</h2><div class="sessions-title-end"><span id="sess-count"></span><button class="chip-btn ghost ico" id="refresh-sessions" aria-label="刷新会话列表" title="重新读取会话列表第一页"><svg class="ico" width="15" height="15" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M42 8V24"/><path d="M6 24L6 40"/><path d="M42 24C42 14.0589 33.9411 6 24 6C18.9145 6 14.3216 8.10896 11.0481 11.5M6 24C6 33.9411 14.0589 42 24 42C28.8556 42 33.2622 40.0774 36.5 36.9519"/></svg></button></div></div>
      <div class="search">
        <svg class="ico" width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 38C30.3888 38 38 30.3888 38 21C38 11.6112 30.3888 4 21 4C11.6112 4 4 11.6112 4 21C4 30.3888 11.6112 38 21 38Z" fill="none"/><path d="M26.657 14.3431C25.2093 12.8954 23.2093 12 21.0001 12C18.791 12 16.791 12.8954 15.3433 14.3431"/><path d="M33.2216 33.2217L41.7069 41.707"/></svg>
        <input id="sess-search" type="search" placeholder="搜索已加载会话、请求或 ID" aria-label="搜索已加载会话">
      </div>
    </div>
    <div class="agent-scope" id="agent-scope">
      <button class="group-head agent-head" id="agent-head" aria-expanded="true" aria-controls="agent-list">
        <span class="chev" aria-hidden="true"><svg class="ico" width="14" height="14" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M36 18L24 30L12 18"/></svg></span><span>Agent</span>
      </button>
      <div class="agent-list" id="agent-list" data-open="true" role="group" aria-label="按 Agent 筛选"></div>
    </div>
    <div class="sessions-list" id="sessions-list"><p class="sess-empty pulse">正在读取本机会话…</p></div>
  </aside>

  <main class="col col-main" id="main"><p class="sess-empty pulse" style="padding:24px">正在读取请求…</p></main>

  <div class="resize-handle" id="rail-resize" role="separator" tabindex="0" aria-label="调整详情栏宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="640" title="拖动调整宽度；双击恢复默认；方向键微调"></div>

  <aside class="col col-rail" id="rail-col" aria-label="请求读数与正文">
    <div class="rail-head" id="rail-head"></div>
    <div class="rail-body" id="rail-body"><div class="rail-empty"><svg class="ico" width="24" height="24" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M24 36C35.0457 36 44 24 44 24C44 24 35.0457 12 24 12C12.9543 12 4 24 4 24C4 24 12.9543 36 24 36Z" fill="none"/><path d="M24 29C26.7614 29 29 26.7614 29 24C29 21.2386 26.7614 19 24 19C21.2386 19 19 21.2386 19 24C19 26.7614 21.2386 29 24 29Z" fill="none"/></svg><b>等待选择</b>数据到达后再显示读数。</div></div>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
