<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Tracery</title>
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="icon" href="/tracery-light.svg" type="image/svg+xml" media="(prefers-color-scheme: light)">
<link rel="icon" href="/tracery-dark.svg" type="image/svg+xml" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar" data-tauri-drag-region="deep">
  <button class="brand" id="brand-home" title="回到主页并刷新">
    <img class="brand-mark brand-mark--light" src="/tracery-light.svg" width="20" height="20" alt="" aria-hidden="true">
    <img class="brand-mark brand-mark--dark" src="/tracery-dark.svg" width="20" height="20" alt="" aria-hidden="true">
    <span>Tracery</span>
  </button>
  <div class="crumb" id="crumb"></div>
  <div class="grow"></div>
  <div class="toolbar-right">
    <span id="backend-slot"></span>
    <button class="icon-btn" id="sidebar-toggle" aria-controls="sessions-col" aria-expanded="true" aria-label="收起会话栏" title="收起会话栏"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M9 3v18" /></svg></button>
    <button class="icon-btn" id="rail-toggle" aria-controls="rail-col" aria-expanded="true" aria-label="收起详情栏" title="收起详情栏"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2" /><path d="M15 3v18" /></svg></button>
    <button class="icon-btn" id="lang-toggle" aria-label="切换界面语言" title="切换界面语言">EN</button>
    <button class="icon-btn" id="theme-toggle" aria-label="切换主题" title="切换主题"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2" /><path d="M12 20v2" /><path d="m4.93 4.93 1.41 1.41" /><path d="m17.66 17.66 1.41 1.41" /><path d="M2 12h2" /><path d="M20 12h2" /><path d="m6.34 17.66-1.41 1.41" /><path d="m19.07 4.93-1.41 1.41" /></svg></button>
    <button class="icon-btn" id="set-settings-toggle" aria-label="设置" title="设置" aria-pressed="false"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 7h8M15 7h6M3 17h2M9 17h12"/><circle cx="13" cy="7" r="2.1"/><circle cx="7" cy="17" r="2.1"/></svg></button>
  </div>
</header>

<div class="app">
  <aside class="col col-sessions" id="sessions-col" aria-label="会话列表">
    <div class="sessions-head">
      <div class="sessions-title"><h2>会话</h2><div class="sessions-title-end"><span id="sess-count"></span><button class="chip-btn ghost ico" id="refresh-sessions" aria-label="刷新会话列表" title="重新读取会话列表第一页"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" /><path d="M8 16H3v5" /></svg></button></div></div>
      <div class="search">
        <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></svg>
        <input id="sess-search" type="search" placeholder="搜索已加载会话、请求或 ID" aria-label="搜索已加载会话">
      </div>
    </div>
    <div class="agent-scope" id="agent-scope">
      <button class="group-head agent-head" id="agent-head" aria-expanded="true" aria-controls="agent-list">
        <span class="chev" aria-hidden="true"><svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6" /></svg></span><span>Agent</span>
      </button>
      <div class="agent-list" id="agent-list" data-open="true" role="group" aria-label="按 Agent 筛选"></div>
    </div>
    <div class="sessions-list" id="sessions-list"><p class="sess-empty pulse">正在读取本机会话…</p></div>
  </aside>

  <main class="col col-main" id="main"><p class="sess-empty pulse" style="padding:24px">正在读取请求…</p></main>

  <div class="resize-handle" id="rail-resize" role="separator" tabindex="0" aria-label="调整详情栏宽度" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="640" aria-valuenow="640" title="拖动调整宽度；双击恢复默认；方向键微调"></div>

  <aside class="col col-rail" id="rail-col" aria-label="请求读数与正文">
    <div class="rail-head" id="rail-head"></div>
    <div class="rail-body" id="rail-body"><div class="rail-empty"><svg class="ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z" /><path d="M5 3a2 2 0 0 0-2 2" /><path d="M19 3a2 2 0 0 1 2 2" /><path d="M5 21a2 2 0 0 1-2-2" /><path d="M9 3h1" /><path d="M9 21h2" /><path d="M14 3h1" /><path d="M3 9v1" /><path d="M21 9v2" /><path d="M3 14v1" /></svg><b>等待选择</b>数据到达后再显示读数。</div></div>
  </aside>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
