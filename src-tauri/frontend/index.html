<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Tracery · 采集器未运行</title>
<meta name="color-scheme" content="light dark">
<style>
  :root { --page:#FAFAF9; --text:#1B1B1A; --text-2:#5C5C58; --line:#E4E4E0; --accent:#0B5FCC; --surface:#FFFFFF; }
  @media (prefers-color-scheme: dark) {
    :root { --page:#121212; --text:#EDEDEA; --text-2:#A5A5A0; --line:#2A2A2A; --accent:#6FAFF7; --surface:#181818; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--page); color: var(--text);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
  }
  main { width: min(420px, calc(100vw - 64px)); }
  h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  p { margin: 0 0 14px; color: var(--text-2); }
  code {
    display: block; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--text); user-select: all;
  }
  button {
    margin-top: 16px; padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--surface); color: var(--text); font: 500 13px/1.4 inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #hint { margin-top: 10px; font-size: 12px; }
  #hint[hidden] { display: none; }
</style>
</head>
<body>
<main>
  <h1>采集器没有运行</h1>
  <p>Tracery 读取本机 127.0.0.1 上的采集器。外壳不会自己启动服务，否则会和 launchd 托管的那一个抢同一个库。</p>
  <code>bun run service start</code>
  <p id="hint" hidden>仍未连上。确认上面的命令已执行，并且服务监听在本机回环地址。</p>
  <button id="retry" type="button">重试连接</button>
</main>
<script>
  const port = window.__ATC_PORT__ ?? '8320';
  const target = `http://127.0.0.1:${port}/?host=desktop`;
  const button = document.getElementById('retry');
  const hint = document.getElementById('hint');
  // no-cors 只用来确认端口有响应：成功即 opaque response，失败才是真不可达。
  button.addEventListener('click', async () => {
    button.disabled = true;
    button.textContent = '正在连接…';
    hint.hidden = true;
    try {
      await fetch(target, { mode: 'no-cors', cache: 'no-store' });
      location.replace(target);
    } catch {
      button.disabled = false;
      button.textContent = '重试连接';
      hint.hidden = false;
    }
  });
</script>
</body>
</html>
